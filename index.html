/* PIXEL FLOATING STARS */
.pixel-stars {
    position: fixed;

}

.pixel-star {
    position: absolute;
    color: #d8caff;
    font-family: monospace;
    font-size: 35px;
    text-shadow: 0 0 10px #a99aff;
    animation: starFloat 4s ease-in-out infinite,

}


.star-1 {
    top: 15%;
    left: 12%;
    font-size: 32px;

}

.star-2 {

    right: 15%;

.star-5 {

    left: 7%;
    font-size: 20px;

}

.star-6 {
    top: 48%;
    right: 8%;
    font-size: 22px;
    animation-delay: 0.8s, 1.2s;
}


@keyframes starFloat {

    }
    50% {

    }
}

    50% {

    }

    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 9999;
}

.magic-star {
    position: absolute;
    font-family: 'Press Start 2P', monospace;
    line-height: 1;
    pointer-events: none;
    user-select: none;
    will-change: transform, opacity;
    text-shadow: 0 0 8px currentColor;
}

/* Sao rơi */
.magic-star.rain {
    animation: pixelStarRain var(--duration) linear var(--delay) forwards;
}

@keyframes pixelStarRain {
    0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 0;
    }
    15% {
        opacity: 1;
    }
    85% {
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

/* Sao bắn tung */
.magic-star.burst {
    animation: pixelStarBurst var(--duration) ease-out var(--delay) forwards;
}

@keyframes pixelStarBurst {
    0% {
        transform: translate(0, 0) scale(0.2) rotate(0deg);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    100% {
        transform: translate(var(--dx), var(--dy))
                   scale(1) rotate(240deg);
        opacity: 0;
    }
}

    // ===== RANDOM PIXEL STAR ANIMATION =====

function triggerStarEffect() {

    // Xóa hiệu ứng cũ nếu có
    document.querySelector(".star-effect-layer")?.remove();

    const layer = document.createElement("div");
    layer.className = "star-effect-layer";
    document.body.appendChild(layer);

    // Random một trong hai hiệu ứng
    const effect = Math.random() < 0.5 ? "rain" : "burst";

    const starSymbols = ["✦", "★"];
    const starColors = [
        "#ffffff",
        "#d8caff",
        "#aaa9ff",
        "#fff2a6",
        "#b9eaff"
    ];

    const starCount = 28;

    for (let i = 0; i < starCount; i++) {

        const star = document.createElement("span");

        star.className = `magic-star ${effect}`;

        // Random hình dạng và màu sắc
        star.textContent =
            starSymbols[Math.floor(Math.random() * starSymbols.length)];

        star.style.color =
            starColors[Math.floor(Math.random() * starColors.length)];

        // Random kích thước
        star.style.fontSize = `${Math.random() * 17 + 10}px`;

        // Random thời gian
        star.style.setProperty(
            "--duration",
            `${Math.random() * 1.5 + 2.5}s`
        );

        star.style.setProperty(
            "--delay",
            `${Math.random() * 0.5}s`
        );

        if (effect === "rain") {

            // Sao rơi từ phía trên
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = "-5vh";

        } else {

            // Sao bắn lên từ phía dưới
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${75 + Math.random() * 20}vh`;

            star.style.setProperty(
                "--dx",
                `${(Math.random() - 0.5) * window.innerWidth * 0.9}px`
            );

            star.style.setProperty(
                "--dy",
                `${-(Math.random() * 65 + 15)}vh`
            );
        }

        layer.appendChild(star);
    }

    // Tự dọn hiệu ứng sau 4.5 giây
    setTimeout(() => {
        layer.remove();
    }, 4500);
}

    function startGame() {
        const input = document.getElementById("username");
        const name = input.value.trim();

        if (!name) {
            alert("Hey astronaut! Enter your name first ✦");
            return;
        }

        currentName = name;

        document.getElementById("welcome").classList.add("hidden");
        document.getElementById("result").style.display = "block";
        document.getElementById("playerName").textContent = name;

        anotherWish();
    }

    function anotherWish() {
    const index = Math.floor(Math.random() * wishes.length);

    const selectedWish = wishes[index];

    // Hiển thị lời chào
    document.getElementById("playerName").textContent =
        currentName;

    // Hiển thị người gửi
    document.getElementById("senderMessage").textContent =
        `Một lời chúc từ ${selectedWish.from} gửi đến ${currentName} ✨`;

    // Hiển thị nội dung lời chúc
    document.getElementById("wish").textContent =
        selectedWish.text;

    // Mã lời chúc
    document.getElementById("wishNumber").textContent =
        `TRANSMISSION #${index + 1}`;

    const result = document.getElementById("result");

    result.style.animation = "none";
    void result.offsetWidth;
    result.style.animation = "reveal .8s ease";
        
        triggerStarEffect();
}

    // STAR PARTICLES
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");

    let stars = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        stars = Array.from({ length: 150 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.8 + 0.3,
            opacity: Math.random(),
            speed: Math.random() * 0.015 + 0.003
        }));
    }

    function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        stars.forEach(star => {
            star.opacity += star.speed;

            if (star.opacity >= 1 || star.opacity <= 0.15) {
                star.speed *= -1;
            }

            ctx.fillStyle = `rgba(210, 205, 255, ${star.opacity})`;
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });

        requestAnimationFrame(animateStars);
    }

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    animateStars();

</script>
